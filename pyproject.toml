[project]
name = "pagekit"
version = "0.1.0"
description = "Structured page templates for a printable notebook"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
pagekit = "pagekit.cli:main"
# Dev-task runner: doctor / build / watch / shot / preview / grid / geom /
# fonts / test / clean / smoke.  Replaces what used to be a Makefile.
pagekit-dev = "pagekit.dev:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pagekit", "pagekit.modules"]
