# Daily journal spread. Started as a reproduction of the original Illustrator
# design (25mm gutter, 2.5/5mm grids) and was redrawn on a 2/4mm grid.
#
#   ../.venv/bin/python -m pagekit build templates/daily.yaml --pdf
#
# All lengths are millimetres unless suffixed (0.25pt, 1in, 12px).

document: daily

page:
  size: [105, 170]
  # Every margin is an even number: the module grid is 2mm and is anchored to
  # the page, so an odd margin would put the whole text block off-grid.
  margins:
    top: 2
    bottom: 8
    inner: 16      # binding side — enough to clear the stitching
    outer: 5       # odd, so that 105 - 16 - 5 = 84 is even

grid:
  module: 2        # every module snaps to this
  dots:
    spacing: 4
    origin: [0, 2]     # page-anchored, so dots line up across modules
    radius: 0.125

defaults:
  gap: 2           # default vertical gap between modules

theme:
  ink: "#000"            # one colour for strokes, text and dots
  stroke_width: 0.25pt
  font:
    family: Montserrat
  label:
    size: 8pt
    weight: 500
    dy: 4          # baseline below the module's top edge. The 3.55 default
                   # optically centres an 8pt cap in a 5mm row; rows are 6mm
                   # on this grid, so (6 + 1.976) / 2 ≈ 4 centres it again.
  heading:
    size: 12pt
    weight: 700
  dots:
    reserve_label: text

# Drawn on every page; `inner` mirrors automatically between recto and verso.
decorations:
  - type: rule
    edge: inner
    offset: 4        # even, so the rule sits on the 2mm grid like everything else

templates:

  daily-front:
    side: right
    content:
      - type: fields
        height: 6
        columns:
          - {label: DATE, width: 28}   # a third of the 84mm block
          - {label: "LOC."}            # takes the remaining 56mm

      # Blank line for the day's theme or title — "First day in Spain!".
      # Unlabelled on purpose: it is one writing line, matching the row above.
      - type: box
        height: 6

      - type: heading
        text: MORNING
        icon: sunrise
        gap: 2

      - type: rating
        label: MOOD
        icon: mood
        count: 5
        gap: 0

      - type: box
        label: NOTES/REFLECTION
        height: fill
        dots: true

      - type: checklist
        rows: 3
        row_height: 4
        row_gap: 2

      - type: heading
        text: EVENING
        icon: moon
        gap: 4

      - type: rating
        label: MOOD
        icon: mood
        count: 5
        gap: 0

      - type: box
        label: NOTES/REFLECTION
        height: fill          # absorbs whatever is left
        dots: true

      - type: box
        label: GRATITUDE
        height: 26
        dots: true

  daily-back:
    side: left
    content:
      - type: box
        label: CONTINUED
        height: fill
        dots: true

      - type: checklist
        rows: 8
        row_height: 4
        row_gap: 2


pages:
  - template: daily-front
  - template: daily-back
