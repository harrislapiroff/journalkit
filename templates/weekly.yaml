# Weekly spread — exercises the parts the daily page doesn't: rows, ruled
# lines, a bare dot field, and a project-local module type.
#
#   ../.venv/bin/python -m pagekit build templates/weekly.yaml --pdf

document: weekly

modules:
  - ../custom/habits.py      # registers `habit_grid`

page:
  size: [105, 170]
  # Even margins, to match the 2mm module grid — see the note in daily.yaml.
  margins: {top: 2, bottom: 8, inner: 16, outer: 5}

grid:
  module: 2
  dots: {spacing: 4, origin: [0, 2], radius: 0.125}

defaults:
  gap: 2

theme:
  font: {family: Montserrat}
  label: {size: 8pt, weight: 500, dy: 4}   # centres the cap in a 6mm row
  heading: {size: 12pt, weight: 700}

decorations:
  - type: rule
    edge: inner
    offset: 4

templates:

  week-plan:
    side: right
    content:
      - type: fields
        columns:
          - {label: WEEK OF}

      - type: heading
        text: WEEK THEME(S)
        gap: 2

      - type: box
        height: 16
        dots: true

      - type: heading
        text: HABITS

      - type: habit_grid
        headers: [M, T, W, T, F, S, S]
        habits: [Fill move ring, Read 5 pages, "", "", ""]
        # 42mm of gutter leaves 6mm columns for the seven days, so the marker
        # lattice is as tight horizontally as the 4mm row + 2mm gap makes it
        # vertically — and the write-your-own rules get the width back.
        label_width: 42
        row_height: 4

      # Two half-width columns of day boxes.
      - type: row
        height: fill
        gap_between: 2
        gap: 8
        content:
          - type: stack
            gap_between: 2
            content:
              - {type: box, label: MON, height: fill}
              - {type: box, label: TUE, height: fill}
              - {type: box, label: WED, height: fill}
          - type: stack
            gap_between: 2
            content:
              - {type: box, label: THU, height: fill}
              - {type: box, label: FRI, height: fill}
              - {type: box, label: "SAT / SUN", height: fill}

  week-notes:
    side: left
    content:
      - type: heading
        text: WEEKLONG TASKS

      - type: checklist
        rows: 8
        row_height: 4
        row_gap: 2

      - type: box
        label: WEEK NOTES
        height: fill
        dots: true

pages:
  - template: week-plan
  - template: week-notes
